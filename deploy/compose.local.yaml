x-local-object-storage: &local-object-storage
  OBJECT_STORAGE_PROVIDER: s3
  OBJECT_STORAGE_ENDPOINT: http://localhost:${MINIO_API_PORT:-19000}
  OBJECT_STORAGE_REGION: ${MINIO_REGION:-us-east-1}
  OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:-muyimusic-local}
  OBJECT_STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-muyimusic-local}
  OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-muyimusic-local-secret-2026}
  OBJECT_STORAGE_PUBLIC_BASE_URL: ""
  OBJECT_STORAGE_ADDRESSING_STYLE: path

services:
  minio:
    image: localstack/localstack:4.9.2
    restart: unless-stopped
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-muyimusic-local}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-muyimusic-local-secret-2026}
    ports:
      - "${MINIO_API_PORT:-19000}:4566"
    volumes:
      - minio-local-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio-init:
    image: amazon/aws-cli:2.31.16
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-muyimusic-local}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-muyimusic-local-secret-2026}
      MINIO_BUCKET: ${MINIO_BUCKET:-muyimusic-local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url=http://minio:4566 s3api head-bucket
        --bucket "$${MINIO_BUCKET}" 2>/dev/null ||
        aws --endpoint-url=http://minio:4566 s3api create-bucket
        --bucket "$${MINIO_BUCKET}" &&
        aws --endpoint-url=http://minio:4566 s3api head-bucket
        --bucket "$${MINIO_BUCKET}" &&
        aws --endpoint-url=http://minio:4566 s3api put-bucket-cors
        --bucket "$${MINIO_BUCKET}"
        --cors-configuration '{"CORSRules":[{"AllowedHeaders":["*"],"AllowedMethods":["GET","HEAD","PUT"],"AllowedOrigins":["http://localhost:5173","http://127.0.0.1:5173","http://localhost:10086","http://127.0.0.1:10086"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}'
    restart: "no"

  migrate:
    environment: *local-object-storage
    depends_on:
      minio-init:
        condition: service_completed_successfully

  bootstrap:
    environment: *local-object-storage

  api:
    environment: *local-object-storage

  worker:
    environment: *local-object-storage

volumes:
  minio-local-data:
