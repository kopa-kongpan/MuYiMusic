resolver 127.0.0.11 valid=10s ipv6=off;

upstream muyimusic_api {
    zone muyimusic_api 64k;
    server api:8000 resolve;
}

upstream muyimusic_admin {
    zone muyimusic_admin 64k;
    server admin:80 resolve;
}

upstream muyimusic_h5 {
    zone muyimusic_h5 64k;
    server h5:80 resolve;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    absolute_redirect off;

    location = /health {
        proxy_pass http://muyimusic_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://muyimusic_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /h5 {
        return 308 /h5/;
    }

    location /h5/ {
        proxy_pass http://muyimusic_h5;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://muyimusic_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

